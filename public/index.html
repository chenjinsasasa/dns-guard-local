<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f6f3">
    <meta name="referrer" content="no-referrer">
    <title>DNS 守卫</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="DNS 守卫首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M12 2.8 20 6v5.8c0 4.7-3.1 8.2-8 9.7-4.9-1.5-8-5-8-9.7V6l8-3.2Z"></path>
              <path d="m8.7 12 2.1 2.1 4.6-4.7"></path>
            </svg>
          </span>
          <span>DNS 守卫</span>
        </a>
        <div class="local-chip"><span></span>仅本机</div>
      </header>

      <main>
        <section class="status-hero" id="status-hero" data-level="loading" aria-labelledby="overall-title">
          <div class="signal-wrap" aria-hidden="true">
            <span class="signal-ring"></span>
            <span class="signal-dot"></span>
          </div>
          <div class="hero-copy">
            <div class="eyebrow-row">
              <span class="eyebrow">网络状态</span>
              <span class="state-badge" id="overall-badge">检查中</span>
            </div>
            <h1 id="overall-title">正在检查网络</h1>
            <p id="overall-message">读取本机 DNS 路径</p>
            <p class="updated-at" id="updated-at">—</p>
          </div>
          <div class="hero-actions">
            <button class="button secondary" id="refresh-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"></path></svg>
              <span data-button-label>刷新</span>
            </button>
            <button class="button primary" id="test-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3l2-5 4 10 2-5h5"></path></svg>
              <span data-button-label>检测</span>
            </button>
          </div>
        </section>

        <section class="protection-bar" aria-labelledby="protection-title">
          <div class="protection-copy">
            <div class="section-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3 20 6.2v5.5c0 4.5-3.2 7.9-8 9.3-4.8-1.4-8-4.8-8-9.3V6.2L12 3Z"></path></svg>
            </div>
            <div>
              <h2 id="protection-title">防泄漏</h2>
              <p id="protection-detail">加密并按规则分流</p>
            </div>
          </div>
          <label class="toggle-control">
            <span class="sr-only">开启或关闭防泄漏</span>
            <input id="protection-toggle" type="checkbox" role="switch" aria-describedby="protection-detail">
            <span class="toggle-track" aria-hidden="true"><span></span></span>
          </label>
        </section>

        <div class="dashboard-grid">
          <section class="panel network-panel" aria-labelledby="network-title">
            <div class="panel-heading">
              <div>
                <span class="section-kicker">本机链路</span>
                <h2 id="network-title">网络概览</h2>
              </div>
              <span class="panel-status" id="network-chip">检查中</span>
            </div>
            <dl class="metric-list">
              <div class="metric-row">
                <dt>活动接口</dt>
                <dd id="network-interface">—</dd>
              </div>
              <div class="metric-row">
                <dt>本机地址</dt>
                <dd id="local-address">—</dd>
              </div>
              <div class="metric-row">
                <dt>默认网关</dt>
                <dd id="network-gateway">—</dd>
              </div>
              <div class="metric-row">
                <dt>代理内核</dt>
                <dd id="clash-state">—</dd>
              </div>
              <div class="metric-row">
                <dt>IPv6</dt>
                <dd id="ipv6-state">—</dd>
              </div>
              <div class="metric-row">
                <dt>Tailscale</dt>
                <dd id="tailscale-state">—</dd>
              </div>
            </dl>
          </section>

          <section class="panel dns-panel" aria-labelledby="dns-title">
            <div class="panel-heading">
              <div>
                <span class="section-kicker">解析路径</span>
                <h2 id="dns-title">DNS 状态</h2>
              </div>
              <span class="panel-status" id="dns-chip">检查中</span>
            </div>
            <div class="dns-route">
              <div class="route-node">
                <span>系统</span>
                <strong id="system-dns">—</strong>
              </div>
              <span class="route-arrow" aria-hidden="true">→</span>
              <div class="route-node">
                <span>接管</span>
                <strong id="dns-route">—</strong>
              </div>
            </div>
            <div class="subsection-heading">
              <h3>上游解析器</h3>
              <span id="endpoint-count">0 个</span>
            </div>
            <ul class="endpoint-list" id="endpoint-list">
              <li class="empty-row">等待读取</li>
            </ul>
          </section>
        </div>

        <section class="panel live-panel" aria-labelledby="live-title">
          <div class="panel-heading live-heading">
            <div>
              <span class="section-kicker">外部复测</span>
              <h2 id="live-title">DNS 泄漏检测</h2>
            </div>
            <span class="privacy-note">双源检测</span>
          </div>
          <div class="empty-state" id="dns-test-empty">
            <div class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4M8 11h6M11 8v6"></path></svg>
            </div>
            <div>
              <h3>尚未检测</h3>
              <p>点击“检测”查询真实出口</p>
            </div>
          </div>
          <div class="live-results" id="dns-test-results" hidden>
            <div class="exit-strip">
              <div>
                <span>公网出口</span>
                <strong id="public-ip">—</strong>
              </div>
              <div>
                <span>网络位置</span>
                <strong id="public-location">—</strong>
              </div>
              <div>
                <span>检测耗时</span>
                <strong id="test-latency">—</strong>
              </div>
            </div>
            <div class="resolver-table-wrap">
              <table class="resolver-table">
                <thead>
                  <tr>
                    <th>DNS 地址</th>
                    <th>运营商</th>
                    <th>位置</th>
                  </tr>
                </thead>
                <tbody id="resolver-table-body"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="panel checks-panel" aria-labelledby="checks-title">
          <div class="panel-heading">
            <div>
              <span class="section-kicker">安全检查</span>
              <h2 id="checks-title">保护明细</h2>
            </div>
            <span class="panel-status" id="checks-count">—</span>
          </div>
          <div class="checks-grid" id="checks-grid" aria-live="polite"></div>
        </section>
      </main>

      <footer class="footer">
        <span>DNS 守卫 1.1.2</span>
        <span>数据留在本机</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
